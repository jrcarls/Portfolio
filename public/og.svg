<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="white" stroke-width="0.5" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Blob decorativo esquerda -->
  <ellipse cx="100" cy="315" rx="300" ry="300" fill="#6366f1" opacity="0.08" filter="blur(80px)"/>
  <!-- Blob decorativo direita -->
  <ellipse cx="1100" cy="200" rx="250" ry="250" fill="#8b5cf6" opacity="0.06" filter="blur(60px)"/>

  <!-- Barra de acento superior esquerda -->
  <rect x="80" y="80" width="4" height="60" rx="2" fill="url(#accent)"/>

  <!-- Tag LegalTech -->
  <rect x="96" y="88" width="130" height="28" rx="14" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.6"/>
  <text x="161" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" font-weight="500">LegalTech</text>

  <!-- Nome -->
  <text x="80" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="72" fill="white" font-weight="700" letter-spacing="-2">Jean Reis</text>

  <!-- Título principal -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#a1a1aa" letter-spacing="-0.5">Desenvolvedor de Software &amp; Automações</text>

  <!-- Linha de destaque -->
  <rect x="80" y="330" width="520" height="3" rx="2" fill="url(#accent)"/>

  <!-- Subtítulo -->
  <text x="80" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#71717a">para Escritórios de Advocacia</text>

  <!-- Separador -->
  <line x1="80" y1="470" x2="1120" y2="470" stroke="white" stroke-width="1" opacity="0.08"/>

  <!-- URL -->
  <text x="80" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#52525b">jeanreis.dev.br</text>

  <!-- Badge direita: "Atendimento direto" -->
  <rect x="900" y="460" width="240" height="60" rx="12" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.08" stroke-width="1"/>
  <text x="1020" y="488" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#a1a1aa" text-anchor="middle">Sem intermediários</text>
  <text x="1020" y="508" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">Fale direto comigo</text>
</svg>
